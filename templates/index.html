<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Online - World Edition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Menu -->
    <div id="main-menu" class="screen active">
        <div class="menu-container">
            <div class="logo">
                <h1>MONOPOLY</h1>
                <h2>World Edition</h2>
            </div>

            <div class="menu-box">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="player-name" placeholder="Enter your name" maxlength="15">
                </div>

                <div class="button-group">
                    <button id="btn-create" class="btn btn-primary">
                        <span class="icon">+</span>
                        Create Room
                    </button>

                    <div class="divider">OR</div>

                    <div class="form-group">
                        <label>Room Code</label>
                        <input type="text" id="room-code" placeholder="Enter room code" maxlength="6" style="text-transform: uppercase;">
                    </div>

                    <button id="btn-join" class="btn btn-secondary">
                        <span class="icon">&#9654;</span>
                        Join Room
                    </button>
                </div>
            </div>

            <div class="rules">
                <h3>How to Play</h3>
                <ul>
                    <li>Roll dice to move around the board</li>
                    <li>Buy properties to collect rent</li>
                    <li>Build houses to increase rent</li>
                    <li>Last player standing wins!</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Lobby -->
    <div id="lobby" class="screen">
        <div class="lobby-container">
            <div class="lobby-header">
                <h2>Game Lobby</h2>
                <div class="room-code-display">
                    Room Code: <span id="lobby-room-code">------</span>
                    <button id="btn-copy" class="btn-small" title="Copy code">📋</button>
                </div>
            </div>

            <div id="players-list" class="players-grid">
                <!-- Players will be added here -->
            </div>

            <div class="lobby-info">
                <p>Waiting for players... (2-4 players)</p>
                <p class="hint">Share the room code with your friends!</p>
            </div>

            <div id="waiting-animation" class="dots-loading">
                <span>.</span><span>.</span><span>.</span>
            </div>
        </div>
    </div>

    <!-- Game -->
    <div id="game" class="screen">
        <div class="game-container">
            <!-- Board -->
            <div class="board-wrapper">
                <div id="board" class="board">
                    <!-- Tiles will be generated by JS -->
                </div>
            </div>

            <!-- Side Panel -->
            <div class="side-panel">
                <!-- Dice Area -->
                <div class="dice-area">
                    <div class="dice-container">
                        <div id="dice1" class="dice">&#9856;</div>
                        <div id="dice2" class="dice">&#9856;</div>
                    </div>
                    <button id="btn-roll" class="btn btn-roll" disabled>
                        ROLL DICE
                    </button>
                </div>

                <!-- Players Panel -->
                <div id="players-panel" class="players-panel">
                    <!-- Players info -->
                </div>

                <!-- Action Panel -->
                <div id="action-panel" class="action-panel">
                    <div id="current-tile-info" class="tile-info">
                        <!-- Current tile info -->
                    </div>
                    <div id="action-buttons" class="action-buttons">
                        <!-- Action buttons -->
                    </div>
                </div>

                <!-- Message -->
                <div id="message-box" class="message-box hidden">
                    <p id="message-text"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal" class="modal">
            <div id="modal-content">
                <!-- Dynamic modal content -->
            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div id="toast" class="toast hidden">
        <p id="toast-text"></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
